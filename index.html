<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Airwaves" />
    <title>Airwaves — Curated Audio & Web Radio Showcase</title>
    <meta name="description" content="A curated single-playlist showcase of 70 independent web radio, audio playlists, and soundscape projects." />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://airwaves.dpdns.org/" />

    <!-- Domain Migration 301-equivalent redirect fallback -->
    <script>
      (function() {
        if (window.location.hostname.includes('morbius.workers.dev')) {
          window.location.replace('https://airwaves.dpdns.org' + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="Airwaves" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://airwaves.dpdns.org/" />
    <meta property="og:title" content="Airwaves — Curated Audio & Web Radio Showcase" />
    <meta property="og:description" content="A curated single-playlist showcase of 70 independent web radio, audio playlists, and soundscape projects." />
    <meta property="og:image" content="https://airwaves.dpdns.org/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Airwaves — Curated Audio & Web Radio Showcase" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://airwaves.dpdns.org/" />
    <meta name="twitter:title" content="Airwaves — Curated Audio & Web Radio Showcase" />
    <meta name="twitter:description" content="A curated single-playlist showcase of 70 independent web radio, audio playlists, and soundscape projects." />
    <meta name="twitter:image" content="https://airwaves.dpdns.org/og-image.svg" />
    <meta name="twitter:image:alt" content="Airwaves — Curated Audio & Web Radio Showcase" />
    
    <!-- Typography (Non-render-blocking async load with fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
    </noscript>

    <!-- Schema.org JSON-LD Structured Data: WebSite & Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Airwaves",
      "url": "https://airwaves.dpdns.org/",
      "description": "A curated single-playlist showcase of 70 independent web radio, audio playlists, and soundscape projects.",
      "inLanguage": "en"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Airwaves",
      "url": "https://airwaves.dpdns.org/",
      "description": "A curated single-playlist showcase of 70 independent web radio, audio playlists, and soundscape projects."
    }
    </script>
  </head>
  <body class="bg-surface-950 text-slate-100 antialiased selection:bg-accent-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
