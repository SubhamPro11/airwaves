<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <title>404 Not Found · Airwaves Radio</title>
    <meta name="description" content="Audio frequency not found. Return to Airwaves to browse 70 curated web radio and soundscape projects." />
    <style>
      body {
        margin: 0;
        background-color: #090a0f;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .card {
        max-width: 32rem;
        width: 100%;
        background: #12131a;
        border: 1px solid #232533;
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 25px 35px -5px rgba(0, 0, 0, 0.6);
        box-sizing: border-box;
      }
      .badge {
        display: inline-block;
        font-family: monospace;
        font-size: 0.75rem;
        color: #f59e0b;
        background: rgba(245, 158, 11, 0.1);
        border: 1px solid rgba(245, 158, 11, 0.3);
        padding: 0.25rem 0.75rem;
        border-radius: 0.375rem;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 1.25rem;
      }
      h1 {
        color: #ffffff;
        font-size: 1.85rem;
        margin: 0 0 0.75rem 0;
        letter-spacing: -0.025em;
      }
      p {
        color: #94a3b8;
        font-size: 0.875rem;
        line-height: 1.6;
        margin: 0 0 1.75rem 0;
      }
      .search-form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.75rem;
      }
      .search-input {
        flex: 1;
        background: #090a0f;
        border: 1px solid #27272a;
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
        color: #ffffff;
        font-size: 0.875rem;
        outline: none;
      }
      .search-input:focus {
        border-color: #f59e0b;
      }
      .search-btn {
        background: #f59e0b;
        color: #090a0f;
        font-weight: 700;
        font-size: 0.875rem;
        border: none;
        border-radius: 0.75rem;
        padding: 0.75rem 1.25rem;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .search-btn:hover {
        background: #fbbf24;
      }
      .categories-title {
        font-family: monospace;
        font-size: 0.6875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
        margin-bottom: 0.75rem;
      }
      .categories-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        margin-bottom: 2rem;
      }
      .category-pill {
        background: #181a24;
        color: #cbd5e1;
        border: 1px solid #27272a;
        border-radius: 0.625rem;
        padding: 0.375rem 0.75rem;
        font-size: 0.75rem;
        text-decoration: none;
        transition: all 0.15s ease;
      }
      .category-pill:hover {
        color: #f59e0b;
        border-color: #f59e0b;
        background: #1c1e2d;
      }
      .home-link {
        display: inline-block;
        background: #181a24;
        color: #cbd5e1;
        border: 1px solid #27272a;
        font-weight: 600;
        font-size: 0.8125rem;
        padding: 0.625rem 1.25rem;
        border-radius: 0.75rem;
        text-decoration: none;
        transition: all 0.15s ease;
      }
      .home-link:hover {
        background: #232533;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">404 · Off-Air</span>
      <h1>Audio feed not found</h1>
      <p>The frequency or station page you requested is off-air. Search the curated directory or pick a popular channel:</p>

      <form class="search-form" action="/" method="GET">
        <input
          class="search-input"
          type="text"
          name="q"
          placeholder="Search 70 stations, mixtapes..."
          aria-label="Search directory"
        />
        <button class="search-btn" type="submit">Search</button>
      </form>

      <div class="categories-title">Popular Audio Channels</div>
      <div class="categories-grid">
        <a class="category-pill" href="/?category=Radio+%26+mixtapes">Radio &amp; mixtapes</a>
        <a class="category-pill" href="/?category=Ambient+%26+mood">Ambient &amp; mood</a>
        <a class="category-pill" href="/?category=Travel+%26+transit">Travel &amp; transit</a>
        <a class="category-pill" href="/?category=Classical+%26+instrumental">Classical &amp; instrumental</a>
      </div>

      <a class="home-link" href="/">Return to Airwaves Directory &rarr;</a>
    </div>
  </body>
</html>
